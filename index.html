<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My GitHub Page</title>
  <style>
    :root {
      --bg-color: #f2f2f2;
      --text-color: #333;
      --button-bg: #007bff;
      --button-hover: #0056b3;
      --link-color: #007bff;
    }

    body.dark {
      --bg-color: #121212;
      --text-color: #ffffff;
      --button-bg: #1e90ff;
      --button-hover: #63a4ff;
      --link-color: #4fc3f7;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      padding: 40px;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      margin-bottom: 30px;
    }

    .button {
      background-color: var(--button-bg);
      color: white;
      border: none;
      padding: 15px 25px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .button:hover {
      background-color: var(--button-hover);
    }

    .link-box {
      display: none;
      margin-top: 10px;
      animation: fadeIn 0.5s ease-in-out;
    }

    .link-box a {
      display: block;
      color: var(--link-color);
      text-decoration: none;
      margin: 5px 0;
      transition: color 0.3s;
    }

    .link-box a:hover {
      text-decoration: underline;
    }

    .theme-toggle {
      position: fixed;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-color);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .button {
        width: 90%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

  <div class="container">
    <h1>Welcome to My GitHub Page</h1>

    <!-- Projects Button -->
    <button class="button" onclick="toggleLinks('links1')">📁 Projects</button>
    <div class="link-box" id="links1">
      <a href="https://github.com/yourusername/project1" target="_blank">Project 1</a>
      <a href="https://github.com/yourusername/project2" target="_blank">Project 2</a>
      <a href="https://github.com/yourusername/project3" target="_blank">Project 3</a>
    </div>

    <!-- Blog Button -->
    <button class="button" onclick="toggleLinks('links2')">✍️ Blog Posts</button>
    <div class="link-box" id="links2">
      <a href="https://yourblog.com/post1" target="_blank">Post 1</a>
      <a href="https://yourblog.com/post2" target="_blank">Post 2</a>
      <a href="https://yourblog.com/post3" target="_blank">Post 3</a>
    </div>

    <!-- Social Button -->
    <button class="button" onclick="toggleLinks('links3')">🌐 Social Media</button>
    <div class="link-box" id="links3">
      <a href="https://twitter.com/yourhandle" target="_blank">Twitter</a>
      <a href="https://linkedin.com/in/yourhandle" target="_blank">LinkedIn</a>
      <a href="https://dev.to/yourhandle" target="_blank">Dev.to</a>
    </div>
  </div>

  <script>
    function toggleLinks(id) {
      // Collapse all open link boxes
      const allBoxes = document.querySelectorAll('.link-box');
      allBoxes.forEach(box => {
        if (box.id !== id) box.style.display = "none";
      });

      // Toggle the clicked one
      const box = document.getElementById(id);
      box.style.display = box.style.display === "block" ? "none" : "block";
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const btn = document.querySelector('.theme-toggle');
      btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    }
  </script>
</body>
</html>
