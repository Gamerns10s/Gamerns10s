<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My GitHub Page</title>
  <style>
    :root {
      --bg-color: #f2f2f2;
      --text-color: #333;
      --button-bg: #007bff;
      --button-hover: #0056b3;
      --link-color: #007bff;
    }

    body.dark {
      --bg-color: #121212;
      --text-color: #ffffff;
      --button-bg: #1e90ff;
      --button-hover: #63a4ff;
      --link-color: #4fc3f7;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      padding: 40px;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      margin-bottom: 30px;
    }

    .button {
      background-color: var(--button-bg);
      color: white;
      border: none;
      padding: 15px 25px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .button:hover {
      background-color: var(--button-hover);
    }

    .theme-toggle {
      position: fixed;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-color);
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .button {
        width: 90%;
        justify-content: center;
      }
      iframe {
        height: 400px;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

  <div class="container">
    <h1>Welcome to My GitHub Page</h1>

    <!-- Buttons for direct page embedding -->
    <button class="button" onclick="loadPage('https://yourblog.com/post1')">✍️ Blog Post 1</button>
    <button class="button" onclick="loadPage('https://github.com/yourusername/project1')">📁 Project 1</button>
    <button class="button" onclick="loadPage('https://twitter.com/yourhandle')">🌐 Twitter</button>
    <button class="button" onclick="loadPage('https://linkedin.com/in/yourhandle')">🌐 LinkedIn</button>
    <button class="button" onclick="loadPage('https://dev.to/yourhandle')">🌐 Dev.to</button>

    <!-- Embedded content area -->
    <iframe id="contentFrame" src=""></iframe>
  </div>

  <script>
    function loadPage(url) {
      document.getElementById('contentFrame').src = url;
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const btn = document.querySelector('.theme-toggle');
      btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    }
  </script>
</body>
</html>
